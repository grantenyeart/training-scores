<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Training Test &middot; Rapid Reach</title>
<meta name="theme-color" content="#020817" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#020817;--bg2:#01030a;--card:#0b1322;--card2:#101c33;--border:#1e293b;--border2:#27364b;
    --text:#f8fafc;--muted:#94a3b8;--muted2:#64748b;--gold:#f59e0b;--green:#34d399;--red:#f87171;
    --grad:linear-gradient(135deg,#f59e0b,#eab308);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(900px 500px at 85% -10%,rgba(245,158,11,.10),transparent 60%),
               linear-gradient(180deg,var(--bg),var(--bg2));}
  .wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:44px 20px 120px;}
  .kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-.02em;line-height:1.05;}
  .gold{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lead{color:var(--muted);font-size:16px;margin-top:14px;}
  .back{display:inline-block;margin-bottom:24px;font-size:13.5px;font-weight:700;color:var(--muted);
    text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:7px 15px;}
  .back:hover{color:var(--gold);border-color:var(--gold);}

  .who{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border2);
    border-radius:14px;padding:18px 20px;margin:26px 0 8px;}
  .who label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  .who input{width:100%;background:#060d1c;border:1px solid var(--border2);color:var(--text);
    border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;}

  .q{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);
    border-left:3px solid var(--border2);border-radius:14px;padding:19px 21px;margin:14px 0;}
  .q.right{border-left-color:var(--green);}
  .q.wrong{border-left-color:var(--red);}
  .qn{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);}
  .qt{font-size:17px;font-weight:700;color:#fff;margin:7px 0 13px;line-height:1.4;}
  .opt{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);
    border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .12s ease,background .12s ease;}
  .opt:hover{border-color:var(--border2);background:rgba(255,255,255,.02);}
  .opt input{margin-top:4px;flex:0 0 auto;accent-color:#f59e0b;}
  .opt span{font-size:15px;color:#cbd5e1;}
  .opt.correct{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.08);}
  .opt.correct span{color:#d1fae5;}
  .opt.picked-wrong{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.08);}
  .opt.picked-wrong span{color:#fecaca;}
  .exp{margin-top:11px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);
    border-radius:10px;padding:12px 14px;font-size:14.5px;color:#e2e8f0;display:none;}
  .exp b{color:#fff;}
  .q.graded .exp{display:block;}

  .bar{height:5px;background:#0b1322;border-radius:999px;overflow:hidden;margin:22px 0 6px;}
  .bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s ease;}
  .step{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);}
  .stage{display:none;} .stage.on{display:block;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--grad);color:#0f172a;
    font-weight:800;font-size:16px;border:0;border-radius:999px;padding:15px 32px;cursor:pointer;font-family:inherit;}
  .btn:hover{filter:brightness(1.08);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);}
  .actions{margin-top:28px;display:flex;gap:11px;flex-wrap:wrap;align-items:center;}
  .note{color:var(--muted2);font-size:13.5px;}

  .result{display:none;background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--border2);border-radius:16px;padding:26px;margin:26px 0;text-align:center;}
  .result.on{display:block;}
  .score{font-family:'Playfair Display',serif;font-size:clamp(46px,10vw,76px);font-weight:900;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .result.pass .score{background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;background-clip:text;}
  .result.fail .score{background:linear-gradient(135deg,#f87171,#ef4444);-webkit-background-clip:text;background-clip:text;}
  .verdict{font-size:19px;font-weight:800;margin-top:10px;}
  .rsub{color:var(--muted);font-size:15px;margin-top:9px;}
  .sent{margin-top:16px;font-size:14px;color:var(--green);display:none;}
  .sent.on{display:block;}
  .senterr{margin-top:16px;font-size:14px;color:var(--gold);display:none;}
  .senterr.on{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="backlink" href="./">&larr; Back to the training</a>
  <div class="kicker">Rapid Reach &middot; Sales Training</div>
  <h1 id="h1"></h1>

  <div class="stage on" id="st-start">
    <p class="lead" id="intro"></p>
    <div class="who">
      <label>Your name</label>
      <input type="text" id="name" placeholder="First and last name" autocomplete="name" />
    </div>
    <div class="actions"><button class="btn" id="begin">Start the test</button></div>
  </div>

  <div class="stage" id="st-quiz">
    <div class="bar"><i id="barfill"></i></div>
    <div class="step" id="step"></div>
    <div id="holder"></div>
    <div class="actions">
      <button class="btn" id="check">Check answer</button>
      <button class="btn" id="next" style="display:none;">Next question</button>
      <span class="note" id="running"></span>
    </div>
  </div>

  <div class="stage" id="st-done">
    <div class="result on" id="result">
      <div class="score" id="score"></div>
      <div class="verdict" id="verdict"></div>
      <p class="rsub" id="rsub"></p>
      <div class="sent" id="sent">Score logged. Your manager can see it.</div>
      <div class="senterr" id="senterr">Could not log the score automatically. Screenshot this and send it to Grant.</div>
    </div>
    <div id="review"></div>
    <div class="actions"><button class="btn ghost" id="retake">Take it again</button></div>
  </div>
</div>

<!-- The shared tracker. Do not paste a URL in here, it lives in score.js. -->
<script src="https://grantenyeart.github.io/training-scores/score.js"></script>

<script>
/* ============================================================
   EDIT THESE TWO BLOCKS ONLY. Everything else runs itself.
   ============================================================ */

const CONFIG = {
  title: "Product Knowledge",   // shows in the heading, the email and the sheet
  track: "Closers",             // Setters, Closers, Everyone
  pass:  11,                    // how many right to pass
  back:  "./"                   // where the back arrow goes
};

const Q = [
 {q:"Replace this with your first question.",
  a:["Wrong answer","The right answer","Wrong answer","Wrong answer"],
  c:1, e:"Why the right answer is right. <b>Bold the part that matters.</b>"},

 {q:"Second question.",
  a:["The right answer","Wrong","Wrong","Wrong"],
  c:0, e:"The reason, in one or two lines."}
];

/* ============================================================
   ENGINE. Leave it alone.
   ============================================================ */

document.title = CONFIG.title + " \u00b7 Rapid Reach";
document.getElementById('h1').innerHTML =
  CONFIG.title.replace(/\s+(\S+)$/, ' <span class="gold">$1</span>');
document.getElementById('backlink').href = CONFIG.back;
document.getElementById('intro').innerHTML =
  Q.length + ' questions, one at a time. You need <b style="color:#fde68a">' +
  CONFIG.pass + ' out of ' + Q.length + '</b> to pass. Watch the training first. ' +
  'You get the answer and the reason after each one, so read them as you go.';

let i = 0, score = 0, picked = null, log = [];

function show(){
  const item = Q[i];
  document.getElementById('step').textContent = 'Question ' + (i+1) + ' of ' + Q.length;
  document.getElementById('barfill').style.width = (i / Q.length * 100) + '%';
  document.getElementById('running').textContent = score + ' right so far';
  const holder = document.getElementById('holder');
  holder.innerHTML =
    '<div class="q" id="cur"><div class="qn">Question ' + (i+1) + '</div>' +
    '<div class="qt">' + item.q + '</div>' +
    item.a.map(function(t,n){
      return '<label class="opt" id="o' + n + '"><input type="radio" name="a" value="' + n + '" />' +
             '<span>' + t + '</span></label>';
    }).join('') +
    '<div class="exp">' + item.e + '</div></div>';
  picked = null;
  document.getElementById('check').disabled = true;
  document.getElementById('check').style.display = 'inline-flex';
  document.getElementById('next').style.display = 'none';
  holder.querySelectorAll('input').forEach(function(r){
    r.onchange = function(){ picked = parseInt(r.value,10); document.getElementById('check').disabled = false; };
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('begin').onclick = function(){
  const n = document.getElementById('name').value.trim();
  if(!n){ alert('Put your name in first.'); document.getElementById('name').focus(); return; }
  document.getElementById('st-start').classList.remove('on');
  document.getElementById('st-quiz').classList.add('on');
  show();
};

document.getElementById('check').onclick = function(){
  if(picked === null) return;
  const item = Q[i], box = document.getElementById('cur');
  box.classList.add('graded');
  document.getElementById('o' + item.c).classList.add('correct');
  if(picked === item.c){ score++; box.classList.add('right'); }
  else { box.classList.add('wrong'); document.getElementById('o' + picked).classList.add('picked-wrong'); }
  log.push({n:i+1, ok:picked === item.c});
  box.querySelectorAll('input').forEach(function(x){ x.disabled = true; });
  this.style.display = 'none';
  const nx = document.getElementById('next');
  nx.style.display = 'inline-flex';
  nx.textContent = (i === Q.length-1) ? 'See my score' : 'Next question';
};

document.getElementById('next').onclick = function(){
  i++;
  if(i < Q.length){ show(); return; }
  document.getElementById('barfill').style.width = '100%';
  document.getElementById('st-quiz').classList.remove('on');
  document.getElementById('st-done').classList.add('on');
  finish();
};

function finish(){
  const name = document.getElementById('name').value.trim();
  const missed = log.filter(function(x){ return !x.ok; }).map(function(x){ return x.n; });
  const pass = score >= CONFIG.pass;
  const r = document.getElementById('result');
  r.classList.add(pass ? 'pass' : 'fail');
  document.getElementById('score').textContent = score + ' / ' + Q.length;
  document.getElementById('verdict').textContent = pass ? 'Passed' : 'Not a pass yet';
  document.getElementById('rsub').textContent = pass
    ? (missed.length ? 'Read the ones you missed again below: ' + missed.join(', ') + '.' : 'Perfect score. Go to work.')
    : 'You need ' + CONFIG.pass + ' to pass. Read the missed ones below, watch the training again, then retake it.';

  document.getElementById('review').innerHTML = missed.length
    ? '<h3 style="font-size:18px;font-weight:800;margin:26px 0 12px;">What you missed</h3>' +
      missed.map(function(n){
        return '<div class="q graded wrong"><div class="qn">Question ' + n + '</div>' +
               '<div class="qt">' + Q[n-1].q + '</div>' +
               '<div class="opt correct"><span>' + Q[n-1].a[Q[n-1].c] + '</span></div>' +
               '<div class="exp">' + Q[n-1].e + '</div></div>';
      }).join('')
    : '';

  RRScore.submit(
    { quiz:CONFIG.title, track:CONFIG.track, name:name, score:score,
      total:Q.length, passed:pass, missed:missed.join(' ') },
    function(){ document.getElementById('sent').classList.add('on'); },
    function(){ document.getElementById('senterr').classList.add('on'); }
  );

  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('retake').onclick = function(){ location.reload(); };
</script>
</body>
</html>
